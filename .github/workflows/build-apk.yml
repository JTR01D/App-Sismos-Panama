name: Compilar y Publicar APK Sismos Panama

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log || (echo "=== GRADLE FAILED ==="; tail -n 80 build_output.log; exit 1)

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          ls -la app/build/outputs/apk/debug/ || ls -la app/build/outputs/apk/ || true
          cp app/build/outputs/apk/debug/*.apk release_assets/SismosPanama.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SismosPanama-APK
          path: release_assets/SismosPanama.apk
          retention-days: 7

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*= *\([0-9]*\).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Detected App Version: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Update Git Tags (Version Tag & 'latest' Pointer)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v${{ steps.get_version.outputs.version_name }}" -m "Release v${{ steps.get_version.outputs.version_name }} (${{ github.sha }})"
          git tag -fa latest -m "Release build v${{ steps.get_version.outputs.version_name }} (${{ github.sha }})"
          git push origin "v${{ steps.get_version.outputs.version_name }}" --force
          git push origin latest --force

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version_name }}"
          name: "Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})"
          body: |
            ## 🇵🇦 Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})
            
            Descarga directa y pública del instalador para Android (no requiere cuenta de GitHub):
            
            - 📲 **Descargar APK**: [SismosPanama.apk](https://github.com/${{ github.repository }}/releases/download/latest/SismosPanama.apk)
            - 🏷️ **Versión**: v${{ steps.get_version.outputs.version_name }} (Compilación ${{ steps.get_version.outputs.version_code }})
            - ⚡ **Monitoreo**: USGS & EMSC en tiempo real para la República de Panamá
            - 🌋 **Geodinámica**: Catálogo tectónico de fallas y zonas sismogénicas
            - 🔔 **Alertas**: Notificaciones sísmicas con sonido y vibración configurables
            - 💎 **Diseño**: Liquid Glass & Jetpack Compose Material 3
          files: release_assets/SismosPanama.apk
          make_latest: true

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
