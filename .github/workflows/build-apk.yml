name: Compilar y Publicar APK Sismos Panama

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Signing Keystore from Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ERROR CRITICO: El secret KEYSTORE_BASE64 no existe o esta vacio en GitHub Secrets!"
            echo "Para que las actualizaciones se puedan instalar sin error 'No se instalo la app', el APK debe firmarse con la misma clave."
            exit 1
          fi
          echo "Decoding persistent keystore from GitHub Secret..."
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > app/release.keystore
          if [ ! -s app/release.keystore ]; then
            echo "::error::app/release.keystore tiene tamaño 0 tras decodificar base64!"
            exit 1
          fi
          ls -lh app/release.keystore

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee build_output.log || (echo "=== GRADLE FAILED ==="; tail -n 80 build_output.log; exit 1)

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_output.log

      - name: Prepare APK for Release
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/release/*.apk release_assets/SismosPanama.apk
          echo "=== Verificando Certificado de Firma del APK ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release_assets/SismosPanama.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs release_assets/SismosPanama.apk | grep "CN=SismosPanama" || (echo "::error::El APK NO esta firmado con CN=SismosPanama!" && exit 1)

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SismosPanama-APK
          path: release_assets/SismosPanama.apk
          retention-days: 7

      - name: Extract App Version
        id: get_version
        run: |
          VERSION_NAME=$(grep 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep 'versionCode = ' app/build.gradle.kts | sed 's/.*= *\([0-9]*\).*/\1/')
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Detected App Version: v$VERSION_NAME (Build $VERSION_CODE)"

      - name: Update Git Tags (Version Tag & 'latest' Pointer)
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "v${{ steps.get_version.outputs.version_name }}" -m "Release v${{ steps.get_version.outputs.version_name }} (${{ github.sha }})"
          git tag -fa latest -m "Release build v${{ steps.get_version.outputs.version_name }} (${{ github.sha }})"
          git push origin "v${{ steps.get_version.outputs.version_name }}" --force
          git push origin latest --force

      - name: Publish GitHub Release (Version Tag)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.get_version.outputs.version_name }}"
          name: "Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})"
          body: |
            ## 🇵🇦 Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})
            
            Descarga directa y pública del instalador para Android (no requiere cuenta de GitHub):
            
            - 📲 **Descargar APK**: [SismosPanama.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version_name }}/SismosPanama.apk)
            - 🏷️ **Versión**: v${{ steps.get_version.outputs.version_name }} (Compilación ${{ steps.get_version.outputs.version_code }})
            - ⚡ **Monitoreo**: USGS & EMSC en tiempo real para la República de Panamá
            - 🌋 **Geodinámica**: Catálogo tectónico de fallas y zonas sismogénicas
            - 🔔 **Alertas**: Notificaciones sísmicas con sonido y vibración configurables
            - 💎 **Diseño**: Liquid Glass & Jetpack Compose Material 3
          files: release_assets/SismosPanama.apk
          make_latest: true

      - name: Update 'latest' GitHub Release Asset
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})"
          body: |
            ## 🇵🇦 Sismos Panamá v${{ steps.get_version.outputs.version_name }} (Build ${{ steps.get_version.outputs.version_code }})
            
            Descarga directa y pública del instalador para Android (no requiere cuenta de GitHub):
            
            - 📲 **Descargar APK**: [SismosPanama.apk](https://github.com/${{ github.repository }}/releases/download/v${{ steps.get_version.outputs.version_name }}/SismosPanama.apk)
            - 🏷️ **Versión**: v${{ steps.get_version.outputs.version_name }} (Compilación ${{ steps.get_version.outputs.version_code }})
          files: release_assets/SismosPanama.apk

      - name: Delete Old Workflow Runs
        uses: Mattraks/delete-workflow-runs@v2
        continue-on-error: true
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 0
